name: Weekly AfterMerge portfolio

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: PtPetrov/aftermerge@v0.1.0
        with:
          github-token: ${{ github.token }}
